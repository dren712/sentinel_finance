services:
  sentinel-finance:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel-finance:latest
    container_name: sentinel-finance
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SOLANA_CLUSTER=${NEXT_PUBLIC_SOLANA_CLUSTER:-devnet}
      - NEXT_PUBLIC_SOLANA_RPC=${NEXT_PUBLIC_SOLANA_RPC:-https://api.devnet.solana.com}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - SENTINEL_PROGRAM_ID=${SENTINEL_PROGRAM_ID:-3gh1Cc2Qc65hJhxZKneXphWJa27z5adyFayc9kWEvAJK}
      - NEXT_PUBLIC_SENTINEL_PROGRAM_ID=${SENTINEL_PROGRAM_ID:-3gh1Cc2Qc65hJhxZKneXphWJa27z5adyFayc9kWEvAJK}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
